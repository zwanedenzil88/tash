                    media = `<div class="lb-media is-video"><video id="lb-video" controls playsinline preload="metadata" ${poster ? `poster="${esc(poster)}"` : ''} src="${esc(v.url)}" aria-label="${esc(it.title)}">Your browser can’t play this video.</video></div>`;
                } else if (v.kind === 'youtube' || v.kind === 'vimeo') {
                    media = `<div class="lb-media is-video"><iframe id="lb-frame" src="${esc(v.embed)}" title="${esc(it.title)}" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
                } else {
                    media = `<div class="lb-media is-video">${posterImg}</div>`;
                    if (v.kind === 'none') note = it.isSample ? 'Sample video placeholder. No video has been added yet.' : 'No video has been added to this item yet.';
                    else if (v.kind === 'external') note = `This video can’t be played here. <a href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">Open it in a new tab</a>.`;
                    else note = 'This video source isn’t supported. Use an .mp4 or .webm file, or a YouTube or Vimeo link.';
                }
            }
            const meta = [it.category, formatGalleryDate(it.date)].filter(Boolean).map(esc).join(' &nbsp;•&nbsp; ');
            main.innerHTML = `${media}
                <div class="lb-cap">
                    <p class="label">${meta}${it.isSample ? ' &nbsp; <span class="tag sample">Sample</span>' : ''}</p>
                    <h2>${esc(it.title)}</h2>
                    ${it.description ? `<p>${esc(it.description)}</p>` : ''}
                    <p class="note" id="lb-note" role="status" ${note ? '' : 'hidden'}>${note}</p>
                    ${n > 1 ? `<p class="label muted">${L.i + 1} / ${n}</p>` : ''}
                </div>`;
            Overlay.el.setAttribute('aria-label', it.title);
            document.querySelectorAll('.lb-nav').forEach(b => { b.style.display = n > 1 ? '' : 'none'; });
            const vid = document.getElementById('lb-video');
            if (vid) vid.addEventListener('error', () => lightboxNote('This video could not be loaded. Check the file path and that it is an MP4 or WebM file.'));
        }

        // =====================================================================
        // GALLERY — admin (create / read / update / delete)
        // =====================================================================
        function adminSet(html) { document.getElementById('admin-panel-content').innerHTML = html; window.scrollTo(0, 0); }
        function savedToast(msg) {
            showToast(persistGallery() ? msg : msg + ' — but this browser blocked saving, so it will be lost on reload.');
        }
        function nextGalleryId(type) {
            const prefix = type === 'video' ? 'video' : 'photo';
            let max = 0;
            store.gallery.forEach(i => { const m = i.id.match(new RegExp('^' + prefix + '-(\\d+)$')); if (m) max = Math.max(max, +m[1]); });
            return prefix + '-' + String(max + 1).padStart(3, '0');
        }
        function isSafeMediaPath(p) {
            if (!p) return true;
            if (/^[a-z][a-z0-9+.-]*:/i.test(p)) return /^https?:\/\//i.test(p);
            return !/^\s*(javascript|data|vbscript)\s*:/i.test(p);
        }
        function validateGalleryItem(it) {
            const e = [];
            if (!it.title) e.push('Add a title.');
            if (it.date && isNaN(new Date(it.date + 'T00:00:00'))) e.push('The date is not valid.');
            if (!isSafeMediaPath(it.src)) e.push('The source must be a file path (images/gallery/…) or an http(s) link.');
            if (!isSafeMediaPath(it.poster)) e.push('The poster must be a file path or an http(s) link.');
            if (it.type === 'video' && it.src) {
                const k = parseVideoSource(it.src).kind;
                if (k === 'external') e.push('Only YouTube and Vimeo links can be embedded. Use one of those, or an .mp4 / .webm file.');
                else if (k === 'unsupported' || k === 'invalid') e.push('Video sources must be an .mp4 / .webm file path, or a YouTube / Vimeo link.');
            }
            if (it.published && !it.isSample && !it.src) e.push('Published items need a source. Add a file path or link, or tick “Sample”, or untick “Published”.');
            return e;
        }

        function adminGalleryList() {
            const n = store.gallery.length, samples = store.gallery.filter(i => i.isSample).length;
            const rows = store.gallery.map(it => {
                const vid = it.type === 'video';
                const thumb = vid ? posterFor(it) : it.src;
                const label = esc(it.title);
                return `<tr data-media-row>
                    <td>${imgTag(thumb, '', vid ? 'video' : 'gallery', 'class="a-thumb" loading="lazy"')}</td>
                    <td><strong>${label}</strong><div class="tags">${it.isSample ? '<span class="tag sample">Sample</span>' : ''}${it.published === false ? '<span class="tag hidden-tag">Hidden</span>' : ''}<span class="tag warn miss-flag">Image not found</span></div></td>
                    <td>${vid ? 'Video' : 'Photo'}</td>
                    <td>${esc(it.category)}</td>
                    <td>${esc(formatGalleryDate(it.date)) || '—'}</td>
                    <td><div class="a-actions">
                        <button type="button" class="btn btn-small" data-id="${esc(it.id)}" aria-label="Preview ${label}" onclick="adminGalleryPreview(this.dataset.id)">Preview</button>
                        <button type="button" class="btn btn-small" data-id="${esc(it.id)}" aria-label="Edit ${label}" onclick="adminGalleryForm(this.dataset.id)">Edit</button>
                        <button type="button" class="btn btn-small" data-id="${esc(it.id)}" aria-label="${it.published === false ? 'Publish' : 'Hide'} ${label}" onclick="adminGalleryToggle(this.dataset.id)">${it.published === false ? 'Publish' : 'Hide'}</button>
                        <button type="button" class="btn btn-small btn-danger" data-id="${esc(it.id)}" aria-label="Delete ${label}" onclick="adminGalleryDelete(this.dataset.id)">Delete</button>
                    </div></td></tr>`;
            }).join('');
            adminSet(`
                <div class="a-head">
                    <h1>Gallery</h1>
                    <div class="btn-row">
                        <button type="button" class="btn btn-primary btn-small" onclick="adminGalleryForm()">+ Add photo / video</button>
                        <button type="button" class="btn btn-small" onclick="adminGalleryExport()">Export</button>
                        ${samples ? `<button type="button" class="btn btn-small" onclick="adminGalleryRemoveSamples()">Remove ${samples} sample${samples > 1 ? 's' : ''}</button>` : ''}
                        <button type="button" class="btn btn-small btn-danger" onclick="adminGalleryReset()">Reset to starter content</button>
                    </div>
                </div>
                <p class="demo-note">Changes are saved in <strong>this browser only</strong> (localStorage). Visitors on other devices will not see them. To publish for everyone: put the files in <code>images/gallery/</code> and <code>videos/gallery/</code>, press <strong>Export</strong>, and paste the result into <code>GALLERY_DEFAULTS</code> in the page code. There is no file upload — this site has no server.</p>
                ${n ? `<div class="table-wrap"><table class="a-table">
                    <thead><tr><th scope="col">Preview</th><th scope="col">Title</th><th scope="col">Type</th><th scope="col">Category</th><th scope="col">Date</th><th scope="col">Actions</th></tr></thead>
                    <tbody>${rows}</tbody></table></div>` : '<div class="empty"><h2>No gallery items</h2><p>Add your first photo or video.</p></div>'}
            `);
        }
        function adminGalleryPreview(id) { const it = galleryById(id); if (it) openLightbox([it], 0); }
        function adminGalleryToggle(id) {
            const it = galleryById(id); if (!it) return;
            it.published = it.published === false;
            savedToast(it.published ? 'Published' : 'Hidden from the public gallery');
            adminGalleryList();
        }
        function adminGalleryDelete(id) {
            const it = galleryById(id); if (!it) return;
            confirmDialog({ title: 'Delete this item?', message: `“${it.title}” will be removed from the gallery. This can’t be undone (the media file itself is not deleted).`, confirmLabel: 'Delete', danger: true, onConfirm: () => {
                store.gallery = store.gallery.filter(x => x.id !== id);
                savedToast('Deleted');
                adminGalleryList();
            } });
        }
        function adminGalleryRemoveSamples() {
            const c = store.gallery.filter(i => i.isSample).length;
            if (!c) return;
            confirmDialog({ title: 'Remove sample entries?', message: `This removes the ${c} item${c > 1 ? 's' : ''} marked “Sample”. Your own items are kept.`, confirmLabel: 'Remove samples', danger: true, onConfirm: () => {
                store.gallery = store.gallery.filter(i => !i.isSample);
                savedToast('Sample entries removed');
                adminGalleryList();
            } });
        }
        function adminGalleryReset() {
            confirmDialog({ title: 'Reset to starter content?', message: 'All gallery changes saved in this browser will be replaced by the starter entries.', confirmLabel: 'Reset', danger: true, onConfirm: () => {
                try { localStorage.removeItem(GALLERY_KEY); } catch (e) {}
                store.gallery = galleryDefaults();
                showToast('Gallery reset to starter content');
                adminGalleryList();
            } });
        }
        function adminGalleryExport() {
            const json = JSON.stringify(store.gallery, null, 2);
            Overlay.open(`<div class="dlg" data-keep>
                <h2>Export gallery</h2>
                <p>Copy this and replace the array inside <code>GALLERY_DEFAULTS</code> in the page code, then raise <code>GALLERY_VERSION</code> by 1. After that every visitor sees these items.</p>
                <div class="form-group" style="margin-top:1rem"><label for="export-text">Gallery data</label><textarea id="export-text" readonly>${esc(json)}</textarea></div>
                <div class="btn-row"><button type="button" class="btn btn-primary" onclick="copyExport()">Copy to clipboard</button><button type="button" class="btn" data-autofocus onclick="Overlay.close()">Close</button></div>
            </div>`, { label: 'Export gallery', className: 'ov-dialog' });
        }
        function copyExport() {
            const t = document.getElementById('export-text');
            t.select();
            const done = () => showToast('Copied to clipboard');
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done, () => { try { document.execCommand('copy'); done(); } catch (e) {} });
            else { try { document.execCommand('copy'); done(); } catch (e) {} }
        }

        function adminGalleryForm(id) {
            const it = id ? galleryById(id) : null;
            const d = it || { id: '', type: 'image', title: '', description: '', alt: '', category: GALLERY_CATEGORIES[0], src: '', poster: '', date: '', published: true, isSample: false };
            const cats = GALLERY_CATEGORIES.includes(d.category) ? GALLERY_CATEGORIES : GALLERY_CATEGORIES.concat(d.category);
            adminSet(`
                <div class="a-head"><h1>${it ? 'Edit item' : 'Add photo / video'}</h1><button type="button" class="btn btn-small" onclick="adminGalleryList()">← Back to list</button></div>
                <form class="form-card a-form" id="gallery-form" onsubmit="adminGallerySave(event)" novalidate>
                    <div id="gf-errors" class="form-errors" role="alert" hidden></div>
                    <input type="hidden" name="id" value="${esc(d.id)}">
                    <div class="form-row">
                        <div class="form-group"><label for="gf-type">Media type</label>
                            <select id="gf-type" name="type" onchange="galleryFormType(); galleryFormPreview(true)"><option value="image" ${d.type === 'image' ? 'selected' : ''}>Photo</option><option value="video" ${d.type === 'video' ? 'selected' : ''}>Video</option></select></div>
                        <div class="form-group"><label for="gf-cat">Category</label>
                            <select id="gf-cat" name="category">${cats.map(c => `<option ${c === d.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
                    </div>
                    <div class="form-group"><label for="gf-title">Title</label><input id="gf-title" name="title" type="text" value="${esc(d.title)}" maxlength="120"></div>
                    <div class="form-group"><label for="gf-desc">Caption (optional)</label><textarea id="gf-desc" name="description" rows="3" maxlength="400">${esc(d.description)}</textarea></div>
                    <div class="form-row">
                        <div class="form-group"><label for="gf-date">Date (optional)</label><input id="gf-date" name="date" type="date" value="${esc(d.date)}"></div>
                        <div class="form-group" id="gf-alt-group"><label for="gf-alt">Image description for screen readers</label><input id="gf-alt" name="alt" type="text" value="${esc(d.alt)}" maxlength="200"></div>
                    </div>
                    <div class="form-group"><label for="gf-src" id="gf-src-label">Source</label><input id="gf-src" name="src" type="text" value="${esc(d.src)}" oninput="galleryFormPreview()" autocomplete="off" spellcheck="false"><p class="form-help" id="gf-src-help"></p></div>
                    <div class="form-group" id="gf-poster-group"><label for="gf-poster">Video thumbnail / poster image</label><input id="gf-poster" name="poster" type="text" value="${esc(d.poster)}" oninput="galleryFormPreview()" placeholder="images/gallery/your-clip-poster.jpg" autocomplete="off" spellcheck="false"><p class="form-help">Optional for YouTube links (the thumbnail is fetched automatically).</p></div>
                    <div class="a-preview"><div class="box"><img id="gf-pv" alt="" src="${placeholder('gallery')}"></div><p id="gf-pv-msg" role="status"></p></div>
                    <label class="check"><input type="checkbox" name="published" ${d.published !== false ? 'checked' : ''}><span>Published <small>Untick to hide it from the public gallery.</small></span></label>
                    <label class="check"><input type="checkbox" name="isSample" ${d.isSample ? 'checked' : ''}><span>Sample entry <small>Shows a “Sample” tag. Untick once it is real media; use “Remove samples” to clear them all.</small></span></label>
                    <div class="btn-row" style="margin-top:1.4rem"><button type="submit" class="btn btn-primary">${it ? 'Save changes' : 'Add to gallery'}</button><button type="button" class="btn" onclick="adminGalleryList()">Cancel</button></div>
                </form>`);
            galleryFormType();
            galleryFormPreview(true);
        }
        function galleryFormType() {
            const vid = document.getElementById('gf-type').value === 'video';
            document.getElementById('gf-poster-group').style.display = vid ? '' : 'none';
            document.getElementById('gf-alt-group').style.display = vid ? 'none' : '';
            document.getElementById('gf-src-label').textContent = vid ? 'Video file or link' : 'Photo file or link';
            document.getElementById('gf-src').placeholder = vid ? 'videos/gallery/your-clip.mp4  or  https://youtu.be/…' : 'images/gallery/your-photo.jpg';
            document.getElementById('gf-src-help').textContent = vid
                ? 'Copy your .mp4 / .webm into videos/gallery/ next to this page, then type its path. YouTube and Vimeo links also work. Leave empty for a placeholder.'
                : 'Copy your photo into images/gallery/ next to this page, then type its path. Leave empty for a placeholder.';
        }
        let pvTimer = null;
        function galleryFormPreview(now) {
            clearTimeout(pvTimer);
            pvTimer = setTimeout(runGalleryPreview, now ? 0 : 300);
        }
        function runGalleryPreview() {
            const f = document.getElementById('gallery-form');
            if (!f) return;
            const vid = f.elements.type.value === 'video', src = f.elements.src.value.trim(), poster = f.elements.poster.value.trim();
            const img = document.getElementById('gf-pv'), msg = document.getElementById('gf-pv-msg');
            const kind = vid ? 'video' : 'gallery';
            let target = src, info = '';
            if (vid) {
                const v = parseVideoSource(src);
                target = poster || v.thumb || '';
                info = { none: 'No video yet — the placeholder will show.', file: 'Local video file. It can only be checked when it plays.', youtube: 'YouTube video recognised.', vimeo: 'Vimeo video recognised.', external: 'Not a YouTube/Vimeo link, so it can’t be embedded.', unsupported: 'Use an .mp4 / .webm path or a YouTube/Vimeo link.', invalid: 'This isn’t a usable video source.' }[v.kind];
            }
            if (!target || !isSafeMediaPath(target)) {
                img.src = placeholder(kind);
                msg.textContent = vid ? info : (src ? 'This isn’t a usable file path or link.' : 'No photo yet — the placeholder will show.');
                return;
            }
            const probe = new Image();
            probe.onload = () => { img.src = target; msg.textContent = (vid ? info + ' ' : '') + 'Thumbnail found. ✓'; };
            probe.onerror = () => { img.src = placeholder(kind); msg.textContent = (vid ? info + ' ' : '') + 'Image not found at this path. Check the folder and file name (paths are relative to this page).'; };
            probe.src = target;
        }
        function adminGallerySave(e) {
            e.preventDefault();
            const f = e.target, v = n => f.elements[n].value.trim();
            const id = v('id'), base = id ? galleryById(id) : null;
            const type = v('type') === 'video' ? 'video' : 'image';
            const it = {
                id: id || nextGalleryId(type), type, title: v('title'), description: v('description'), alt: type === 'image' ? v('alt') : '',
                category: v('category'), src: v('src'), poster: type === 'video' ? v('poster') : '', date: v('date'),
                published: f.elements.published.checked, isSample: f.elements.isSample.checked
            };
            const errs = validateGalleryItem(it), box = document.getElementById('gf-errors');
            if (errs.length) {
                box.innerHTML = `<strong>Please fix:</strong><ul>${errs.map(m => `<li>${esc(m)}</li>`).join('')}</ul>`;
                box.hidden = false;
                box.scrollIntoView({ block: 'center' });
                return;
            }
            if (base) Object.assign(base, it); else store.gallery.unshift(it);
            savedToast(base ? 'Changes saved' : 'Added to the gallery');
            adminGalleryList();
        }

        // --- INITIALIZATION ---
        window.addEventListener('DOMContentLoaded', () => {
            renderFooterSocials();
            router.navigate('home');
        });

    </script>
</body>
</html>
